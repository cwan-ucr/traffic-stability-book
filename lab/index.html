<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>跟驰稳定性实验台</title>
  <style>
    html, body, #root { margin: 0; min-height: 100%; }
    body { min-width: 320px; }
    noscript { display: block; padding: 24px; font-family: sans-serif; }
    .language-switcher { position: fixed; top: 10px; right: 14px; z-index: 1000; display: flex; gap: 2px; padding: 3px; border: 1px solid #aeb8b2; border-radius: 4px; background: rgba(248, 249, 245, .96); box-shadow: 0 2px 10px rgba(25, 40, 34, .10); }
    .language-switcher button { min-width: 58px; border: 0; border-radius: 2px; padding: 6px 9px; background: transparent; color: #45534d; font: 600 12px/1.2 ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
    .language-switcher button.is-active { background: #285f52; color: #fff; }
    @media (max-width: 720px) { .language-switcher { top: 6px; right: 7px; } .language-switcher button { min-width: 50px; padding: 5px 7px; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="language-switcher" aria-label="Language switcher">
    <button type="button" data-lang="zh" onclick="window.TSL_I18N.setLanguage('zh')">中文</button>
    <button type="button" data-lang="en" onclick="window.TSL_I18N.setLanguage('en')">English</button>
  </div>
  <noscript>请在浏览器中启用 JavaScript 后重新打开。</noscript>
  <script src="i18n.js"></script>
  <script src="react.min.js"></script>
  <script src="react-dom.min.js"></script>
  <script src="application-cases-data.js"></script>
  <script src="babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
